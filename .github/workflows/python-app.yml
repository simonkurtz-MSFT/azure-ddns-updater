# This workflow will install Python dependencies and lint for all supported version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python Azure DDNS Updater

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
    # Check out the repository so the workflow can access the project files.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # Install the matrix-selected Python version and cache pip packages.
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    # Upgrade pip and install the project's declared dependencies.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt
    # Run PyLint against the DDNS updater module.
    - name: Linting the python module with PyLint
      run: |
        pylint ./azure-ddns-updater.py ./azure_ddns_updater.py
    - name: Run unit tests
      run: python -m unittest discover -s tests -v
    continue-on-error: false
